server:
  port: 8081

spring:
  application:
    name: wms

  data:
    redis:
      host: localhost
      port: 6379

  datasource:
    url: jdbc:postgresql://localhost:5432/wms
    username: wms
    password: wms
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 30000

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  graphql:
    graphiql:
      enabled: false

  ai:
    mcp:
      server:
        protocol: STREAMABLE
        name: k-wms-mcp
        version: 0.0.1

# JWT 설정. secret은 HS256용 대칭키(최소 32바이트)이며 소스에 두지 않는다.
# 반드시 환경변수 APP_JWT_SECRET로 주입한다(미설정 시 기동 실패).
app:
  jwt:
    secret: ${APP_JWT_SECRET}
    expiration-minutes: ${APP_JWT_EXPIRATION_MINUTES:15}
    refresh-expiration-days: ${APP_REFRESH_TOKEN_EXPIRATION_DAYS:14}
  security:
    exposure:
      mcp-public: ${APP_SECURITY_MCP_PUBLIC:false}
      dev-endpoints-public: ${APP_SECURITY_DEV_ENDPOINTS_PUBLIC:false}
